name: Package

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:

jobs:
  package-linux:
    name: Build Linux Packages (.deb & .tar.gz)
    runs-on: rust

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://oauth2:${{ secrets.GITHUB_TOKEN }}@codeberg.org/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.ref }}"
          git checkout FETCH_HEAD

      - name: Install system and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            libjack-jackd2-dev \
            clang \
            libclang-dev \
            dpkg-dev \
            curl \
            jq

      - name: Build and test workspace
        run: |
          cargo test --workspace --locked
          cargo build --release -p pipelink --locked

      - name: Build .deb and .tar.gz packages
        run: |
          ./packaging/debian/build-deb.sh dist
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ARCH="$(uname -m)"
          STAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGE_DIR"' EXIT
          make install DESTDIR="$STAGE_DIR" PREFIX=/usr
          tar -C "$STAGE_DIR" -czf "dist/pipelink-${VERSION}-linux-${ARCH}.tar.gz" .
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      - name: Publish tag release assets on Codeberg
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          API="https://codeberg.org/api/v1/repos/${{ github.repository }}"
          AUTH="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
          REL_JSON="$(curl -fsSL -H "$AUTH" "$API/releases/tags/$TAG" 2>/dev/null || true)"
          if [ -z "$REL_JSON" ] || [ "$(echo "$REL_JSON" | jq -r '.id // empty')" = "" ]; then
            REL_JSON="$(curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "$(jq -n --arg tag "$TAG" '{tag_name: $tag, name: $tag}')" \
              "$API/releases")"
          fi
          REL_ID="$(echo "$REL_JSON" | jq -r '.id')"
          for file in dist/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            curl -fsSL -X POST -H "$AUTH" -F "attachment=@$file" \
              "$API/releases/${REL_ID}/assets?name=${name}" >/dev/null
            echo "Uploaded $name to release $TAG"
          done
