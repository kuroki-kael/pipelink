name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check-and-build:
    name: Cargo Check & Build
    runs-on: rust

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://oauth2:${{ secrets.GITHUB_TOKEN }}@codeberg.org/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.ref }}"
          git checkout FETCH_HEAD

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            libjack-jackd2-dev \
            clang \
            libclang-dev

      # The rust image of the runner does not ship clippy for the toolchain
      # it pins, and without it the lint step cannot run at all.
      - name: Install clippy
        run: rustup component add clippy

      # The project formats with nightly rustfmt, because its configuration
      # uses options that stable rustfmt ignores.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Run cargo check
        run: cargo check --workspace --all-targets

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings

      - name: Run cargo fmt
        run: cargo +nightly fmt --all --check

      - name: Run cargo build
        run: cargo build --workspace --all-targets --release

      - name: Run cargo test
        run: cargo test --workspace
