[workspace]
resolver = "3"
members = ["crates/*", "app"]
default-members = ["app"]

[workspace.package]
version = "0.1.1"
description = "Virtual PipeWire/JACK audio routing daemon and CLI"
repository = "https://codeberg.org/kuroki-kael/pipelink"
keywords = ["audio", "routing", "pipewire", "jack"]
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
authors = ["Kuroki-Kael <kuroki@kuroki-kael.com>"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_clone = "deny"
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# Internal
pipelink-engine = { version = "0.1.1", path = "crates/engine" }
pipelink-jack = { version = "0.1.1", path = "crates/jack" }
pipelink-pw = { version = "0.1.1", path = "crates/pipewire" }
pipelink-resolver = { version = "0.1.1", path = "crates/resolver" }
pipelink-common = { version = "0.1.1", path = "crates/common" }

# Audio
jack = { version = "0.14.0" }
pipewire = { version = "0.10.1" }
pipewire-sys = { version = "0.10.1" }

# Logging & Error
thiserror = { version = "2.0.21" }
anyhow = { version = "1.0.104" }
tracing = { version = "0.1.44" }
tracing-journald = { version = "0.3.2" }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "tracing-log",
] }

# CLI
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11" }
clap_mangen = { version = "0.3.3" }

# Util
tokio = { version = "1.53.1", features = ["full"] }
rtrb = { version = "0.4.1" }
parking_lot = { version = "0.13.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true